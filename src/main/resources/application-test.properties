
# Separate MySQL database for automated tests
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shop_api_test
spring.datasource.username=shop_user
spring.datasource.password=${DB_PASSWORD}

# Hibernate database schema management
spring.jpa.hibernate.ddl-auto=update

# Reduce unnecessary SQL logging
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
