
# Application name
spring.application.name=shop-api

# MySQL connection
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/shop_api
spring.datasource.username=shop_user
spring.datasource.password=${DB_PASSWORD}

# MySQL JDBC driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000


spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/shop_api}
spring.datasource.username=${DB_USERNAME:shop_user}
spring.datasource.password=${DB_PASSWORD}
